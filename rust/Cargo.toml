[package]
name = "taffy_rust"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Rust layout engine for the taffy Qt library (cxx-qt)"

# Static library that CMake links into the C++ taffy target.
[lib]
crate-type = ["staticlib"]

[dependencies]
cxx = "1.0.95"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
taffy = "0.15.0"

[build-dependencies]
# link_qt_object_files is required when statically linking Qt 6.
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }

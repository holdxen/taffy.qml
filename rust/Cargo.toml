[package]
name = "taffy_rust"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Pure-Rust layout engine (taffy) exported to C++ via cxx — no Qt dependency"

[lib]
crate-type = ["staticlib"]

[dependencies]
cxx = "1.0"
taffy = "0.15.0"

[build-dependencies]
cxx-build = "1.0"
